# OpenStreetMap map tiles, fetched and cached by this server (see location /tiles/ below).
proxy_cache_path /var/cache/nginx/osm levels=1:2 keys_zone=osm_tiles:10m max_size=1g inactive=14d use_temp_path=off;

server {
    listen 443 ssl;
    server_name quarcnet0.tail84500c.ts.net;
    root /usr/share/nginx/html;
    index index.html;

    ssl_certificate     /etc/nginx/ssl/quarcnet0.tail84500c.ts.net.crt;
    ssl_certificate_key /etc/nginx/ssl/quarcnet0.tail84500c.ts.net.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    # Activity routes and touring data are large JSON — worth compressing.
    gzip on;
    gzip_types application/json application/javascript text/css image/svg+xml;
    gzip_min_length 1024;

    # Map tiles. The apps ask for /tiles/z/x/y.png; this server fetches them from
    # OpenStreetMap once, identifies itself the way OSM's tile usage policy asks, and
    # serves repeats from its own cache. Nothing from the client goes upstream: no login
    # cookie, no Authorization header, no client IP.
    location ~ "^/tiles/(?<z>\d{1,2})/(?<x>\d{1,7})/(?<y>\d{1,7})\.png$" {   # quoted: nginx would read the {1,2} braces as a block
        resolver 127.0.0.11 valid=300s ipv6=off;   # Docker's DNS; the host name is looked up at request time
        proxy_pass https://tile.openstreetmap.org/$z/$x/$y.png;
        proxy_ssl_server_name on;
        proxy_http_version 1.1;
        proxy_pass_request_headers off;
        proxy_pass_request_body off;
        proxy_set_header Host tile.openstreetmap.org;
        proxy_set_header Connection "";
        proxy_set_header User-Agent "QuarcSport/1.0 (self-hosted; +https://github.com/zekicandemiralay/Quarc_Sport)";
        proxy_set_header Referer "https://quarcnet0.tail84500c.ts.net:4007/";
        proxy_set_header Accept "image/png,image/*;q=0.8";

        proxy_cache osm_tiles;
        proxy_cache_lock on;
        proxy_cache_valid 200 7d;     # only used when OSM sends no expiry of its own (its headers win)
        proxy_cache_valid 404 1m;     # errors are not cached: a blip must not stick
        proxy_cache_use_stale error timeout updating http_500 http_502 http_503 http_504;

        proxy_hide_header Cache-Control;
        add_header Cache-Control "public, max-age=86400" always;
        add_header X-Tile-Cache $upstream_cache_status always;
    }

    # Shared login (Quarc Auth) — same account works across every Quarc app.
    # More specific than /api/ below, so nginx matches this first for auth routes.
    location /api/auth/ {
        proxy_pass http://quarc-auth:3002/api/auth/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_buffering off;
        proxy_cache off;
    }

    location /api/ {
        proxy_pass http://api:8000/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
